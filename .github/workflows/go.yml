name: Go

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: activitylog_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: activitylog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d activitylog_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod tidy && git diff --exit-code

      - name: Run tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
        env:
          MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/activitylog_test?parseTime=true
          POSTGRES_DSN: host=127.0.0.1 user=postgres password=postgres dbname=activitylog_test port=5432 sslmode=disable TimeZone=UTC

      - name: Enforce 100% coverage
        run: |
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')"
          echo "Total coverage: ${coverage}"
          test "${coverage}" = "100.0%"

      - name: Run vet
        run: go vet ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          fail_ci_if_error: false