<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" rx="24" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="820" cy="40" r="120" fill="#38bdf8" opacity="0.07"/>
  <circle cx="60" cy="300" r="90" fill="#a3e635" opacity="0.06"/>

  <!-- Activity log icon (document with clock) -->
  <g transform="translate(90,70) scale(0.9)" filter="url(#shadow)">
    <rect x="20" y="10" width="130" height="160" rx="14" fill="url(#accent)"/>
    <rect x="34" y="26" width="102" height="128" rx="8" fill="#0c4a6e"/>
    <rect x="46" y="48" width="78" height="8" rx="4" fill="#e0f2fe"/>
    <rect x="46" y="72" width="62" height="8" rx="4" fill="#e0f2fe" opacity="0.8"/>
    <rect x="46" y="96" width="70" height="8" rx="4" fill="#e0f2fe" opacity="0.6"/>
    <!-- Clock -->
    <circle cx="130" cy="150" r="38" fill="#0f172a" stroke="url(#accent)" stroke-width="8"/>
    <path d="M130 130 L130 150 L144 158" fill="none" stroke="#e0f2fe" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="290" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#f8fafc">gorm-activitylog</text>

  <!-- Accent line -->
  <rect x="292" y="168" width="120" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- Badges -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="292" y="196" width="70" height="32" rx="16" fill="#0ea5e9" opacity="0.2" stroke="#0ea5e9"/>
    <text x="327" y="217" text-anchor="middle" fill="#7dd3fc">Go</text>

    <rect x="372" y="196" width="90" height="32" rx="16" fill="#34d399" opacity="0.2" stroke="#34d399"/>
    <text x="417" y="217" text-anchor="middle" fill="#6ee7b7">GORM</text>

    <rect x="472" y="196" width="90" height="32" rx="16" fill="#a3e635" opacity="0.2" stroke="#a3e635"/>
    <text x="517" y="217" text-anchor="middle" fill="#d9f99d">Audit</text>

    <rect x="572" y="196" width="100" height="32" rx="16" fill="#f59e0b" opacity="0.2" stroke="#f59e0b"/>
    <text x="622" y="217" text-anchor="middle" fill="#fcd34d">Tracking</text>
  </g>
</svg>